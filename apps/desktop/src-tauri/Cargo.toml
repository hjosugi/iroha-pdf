[package]
name = "iroha-pdf"
version = "0.4.0"
description = "Local-first PDF workspace"
authors = ["Iroha PDF contributors"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "iroha_pdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

[patch.crates-io]
# Tauri's GTK3 stack requires glib 0.18.5. This local copy contains only the
# upstream VariantStrIter soundness fix; see vendor/glib-0.18.5-patched/PROVENANCE.md.
glib = { path = "vendor/glib-0.18.5-patched" }
