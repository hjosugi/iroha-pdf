    <title>Iroha PDF</title>
    <!--
      The brand mark, inlined rather than fetched. A `/favicon.svg` would be one
      more request the shell has to make before it can paint, and this app is
      built to need no network at all (`e2e/offline.spec.ts`); `img-src data:`
      is already permitted by the CSP in `src-tauri/tauri.conf.json`.

      This is a copy of `assets/branding/iroha-icon.svg`, percent-encoded. It is
      a copy, so it can drift: `release/branding/validate-assets.mjs` re-derives
      the URL from that master and fails if this line no longer matches it.
    -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 1024'%3E%3Crect width='1024' height='1024' fill='%232B5CFF'/%3E%3Cg fill='none' stroke='%23FFFFFF' stroke-linecap='round' stroke-linejoin='round' stroke-width='82'%3E%3Cpath d='M330 292c-22 132-12 307 43 407 31 57 81 31 129-69'/%3E%3Cpath d='M587 347c82 80 119 181 127 303'/%3E%3C/g%3E%3C/svg%3E"
    />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
