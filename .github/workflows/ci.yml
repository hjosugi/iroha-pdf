name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      store_screenshots:
        description: Build the native screenshot set instead of the regular CI jobs
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # A manual device-evidence run and a store-screenshot run exercise different
  # native builds and may run together. Keep them separate from PR/push checks
  # too, so starting evidence never cancels an ordinary required check.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.store_screenshots || false }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.13.0
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality and Expo validation
    if: github.event_name != 'workflow_dispatch' || inputs.store_screenshots != true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Byte-identical to the block in the `tauri` job below and in
      # .github/workflows/release.yml. It runs on three operating systems there,
      # so it is written once and copied rather than kept in two shapes; raise
      # the version in all three together with frost.toml's minimum version.
      - name: Install checksummed FrostBuild
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux)
              asset=frostbuild-v0.8.0-x86_64-unknown-linux-musl.tar.gz
              sha=7a70953d61831109daf66cc02f9e93ec2740db1c4fa8bc680530e8b5cae46795 ;;
            macOS)
              asset=frostbuild-v0.8.0-aarch64-apple-darwin.tar.gz
              sha=834b3d841e78e5a46851fb84202d49a6faaa5c0cc64d9b9e0cee0fd314d01bf6 ;;
            Windows)
              asset=frostbuild-v0.8.0-x86_64-pc-windows-msvc.zip
              sha=358e95577aa865b679cf35f31405ae9ffe2f4acc7b586f65cf5a253bd1394b31 ;;
            *)
              echo "::error::no pinned FrostBuild release for $RUNNER_OS"
              exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/frost"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/$asset" \
            "https://github.com/hjosugi/frost-build/releases/download/v0.8.0/$asset"
          # Chosen by runner, not by which binary exists: macOS has a
          # `sha256sum`, but a BSD one that rejects `--check` and the
          # "digest  path" line GNU reads, so probing for the name picks a tool
          # that cannot do the job. Compared as strings so no --check dialect
          # is involved at all.
          # Read from stdin, not by name. GNU sha256sum escapes a filename
          # containing a backslash and marks the line by prefixing the digest
          # with one, and every Windows path has backslashes — the digest then
          # compares unequal to an identical pin. With stdin there is no
          # filename in the output to escape.
          case "$RUNNER_OS" in
            macOS) actual="$(shasum --algorithm 256 < "$RUNNER_TEMP/$asset" | cut -d' ' -f1)" ;;
            *)     actual="$(sha256sum < "$RUNNER_TEMP/$asset" | cut -d' ' -f1)" ;;
          esac
          if [[ "$actual" != "$sha" ]]; then
            echo "::error::$asset has sha256 $actual; the pin expects $sha"
            exit 1
          fi
          case "$asset" in
            *.zip)
              unzip -q -j "$RUNNER_TEMP/$asset" -d "$RUNNER_TEMP/frost" ;;
            *)
              tar --extract --gzip --file "$RUNNER_TEMP/$asset" \
                --directory "$RUNNER_TEMP/frost" --strip-components=1 ;;
          esac
          echo "$RUNNER_TEMP/frost" >> "$GITHUB_PATH"
      - name: Install locked dependencies
        run: npm ci
      - name: Run every cached Frost test and validation target
        run: frost test --all --no-tui
      - name: Build the desktop web output through Frost
        run: frost build desktop-web --no-tui
      - name: Resolve public Expo config
        run: npx expo config --type public --json > expo-config.json
        working-directory: apps/mobile
      - name: Validate iOS prebuild structure
        shell: bash
        run: |
          set -euo pipefail
          npx expo prebuild --platform ios --no-install --clean
          grep --fixed-strings --line-regexp 'use_modular_headers!' ios/Podfile
          node -e "const p=require('./ios/Podfile.properties.json'); if(p.EXPO_USE_PRECOMPILED_MODULES!=='false') process.exit(1)"
        working-directory: apps/mobile
        env:
          EXPO_NO_DOCTOR: "1"
      - name: Validate Android prebuild
        shell: bash
        run: |
          set -euo pipefail
          npx expo prebuild --platform android --no-install --clean
          application=android/app/src/main/java/app/irohapdf/mobile/MainApplication.kt
          settings=android/settings.gradle
          grep --fixed-strings --line-regexp \
            'import com.facebook.react.config.ReactFeatureFlags' "$application"
          grep --fixed-strings --line-regexp \
            '    ReactFeatureFlags.dispatchPointerEvents = true' "$application"
          grep --fixed-strings --line-regexp \
            'includeBuild(irohaReactNativeSource)' "$settings"
        working-directory: apps/mobile
        env:
          EXPO_NO_DOCTOR: "1"
      - name: Retain web build and resolved Expo config
        uses: actions/upload-artifact@v7
        with:
          name: quality-artifacts
          path: |
            apps/desktop/dist/
            apps/mobile/expo-config.json
          if-no-files-found: error
          retention-days: 14

  # This job used to run a bare `cargo build --release`: a compile with no
  # declared inputs, no relationship to `desktop-web`, and no packaging, which
  # meant nothing ever proved the installers a release ships can be produced at
  # all. It now runs the same Frost target the Release workflow runs, so a
  # bundler that breaks breaks here, on the pull request, and not halfway
  # through cutting a release.
  #
  # The job name is load-bearing: scripts/github/protect-main.sh requires
  # `Tauri (<os>)` on main and .github/workflows/release.yml reads that list to
  # decide whether a commit is releasable. Renaming it silently weakens both.
  tauri:
    name: Tauri (${{ matrix.os }})
    if: github.event_name != 'workflow_dispatch' || inputs.store_screenshots != true
    runs-on: ${{ matrix.os }}
    # Was 45 for a compile. Bundling adds three bundlers on Linux, WiX and NSIS
    # downloads on Windows, and a second architecture on macOS.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            frost_target: desktop-app-linux
            frost_platform: ''
          - os: macos-latest
            frost_target: desktop-app-macos
            frost_platform: ''
          - os: windows-latest
            frost_target: desktop-app-windows
            frost_platform: '--platform windows'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Add the second macOS architecture
        if: runner.os == 'macOS'
        # `desktop-app-macos` builds `universal-apple-darwin`, which needs both
        # slices' standard libraries. No credentials are involved.
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Install checksummed FrostBuild
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux)
              asset=frostbuild-v0.8.0-x86_64-unknown-linux-musl.tar.gz
              sha=7a70953d61831109daf66cc02f9e93ec2740db1c4fa8bc680530e8b5cae46795 ;;
            macOS)
              asset=frostbuild-v0.8.0-aarch64-apple-darwin.tar.gz
              sha=834b3d841e78e5a46851fb84202d49a6faaa5c0cc64d9b9e0cee0fd314d01bf6 ;;
            Windows)
              asset=frostbuild-v0.8.0-x86_64-pc-windows-msvc.zip
              sha=358e95577aa865b679cf35f31405ae9ffe2f4acc7b586f65cf5a253bd1394b31 ;;
            *)
              echo "::error::no pinned FrostBuild release for $RUNNER_OS"
              exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/frost"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/$asset" \
            "https://github.com/hjosugi/frost-build/releases/download/v0.8.0/$asset"
          # Chosen by runner, not by which binary exists: macOS has a
          # `sha256sum`, but a BSD one that rejects `--check` and the
          # "digest  path" line GNU reads, so probing for the name picks a tool
          # that cannot do the job. Compared as strings so no --check dialect
          # is involved at all.
          # Read from stdin, not by name. GNU sha256sum escapes a filename
          # containing a backslash and marks the line by prefixing the digest
          # with one, and every Windows path has backslashes — the digest then
          # compares unequal to an identical pin. With stdin there is no
          # filename in the output to escape.
          case "$RUNNER_OS" in
            macOS) actual="$(shasum --algorithm 256 < "$RUNNER_TEMP/$asset" | cut -d' ' -f1)" ;;
            *)     actual="$(sha256sum < "$RUNNER_TEMP/$asset" | cut -d' ' -f1)" ;;
          esac
          if [[ "$actual" != "$sha" ]]; then
            echo "::error::$asset has sha256 $actual; the pin expects $sha"
            exit 1
          fi
          case "$asset" in
            *.zip)
              unzip -q -j "$RUNNER_TEMP/$asset" -d "$RUNNER_TEMP/frost" ;;
            *)
              tar --extract --gzip --file "$RUNNER_TEMP/$asset" \
                --directory "$RUNNER_TEMP/frost" --strip-components=1 ;;
          esac
          echo "$RUNNER_TEMP/frost" >> "$GITHUB_PATH"
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        # `xdg-utils` is new: the AppImage bundler copies /usr/bin/xdg-open into
        # the AppDir and fails outright without it. The rest is unchanged;
        # patchelf is what rewrites the rpath of the binaries it copies in.
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Install locked dependencies
        run: npm ci
      # Builds the desktop-web tree through the graph and then bundles it. The
      # Vite build is a Frost dependency of the packaging target, so there is no
      # separate web-asset step here any more.
      - name: Build and bundle the desktop app through Frost
        run: frost build ${{ matrix.frost_target }} --profile release ${{ matrix.frost_platform }} --no-tui
      # Windows builds under a Frost platform overlay, because npm is named
      # `npm.cmd` there; asking for an overlay puts its name in ${config}, so
      # the packages land one directory deeper. Resolved here rather than
      # hardcoded twice: a wrong path fails the upload loudly, but a wrong
      # guess about which host is which would not.
      - name: Locate the staged packages
        id: staged
        shell: bash
        run: |
          set -euo pipefail
          dir="$(find apps/desktop/bundle -type d -name release -print -quit)"
          if [[ -z "$dir" ]]; then
            echo "::error::the bundle step staged nothing under apps/desktop/bundle"
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          printf 'staged in %s:\n' "$dir"
          ls -1 "$dir"

      - name: Retain the desktop packages
        uses: actions/upload-artifact@v7
        with:
          name: desktop-packages-${{ runner.os }}
          path: ${{ steps.staged.outputs.dir }}/
          if-no-files-found: error
          retention-days: 14

  supply-chain:
    name: Supply-chain policy
    if: github.event_name != 'workflow_dispatch' || inputs.store_screenshots != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Install locked dependencies
        run: npm ci
      - name: Verify temporary dependency patches
        run: npm run verify:dependency-patches
      - name: Audit npm advisories
        # libxmljs2 is an optional XML validator of the dev-only CycloneDX
        # library. The project emits JSON SBOMs; audit the installed product
        # graph without treating that unused optional peer as shipped code.
        run: npm audit --omit=optional --audit-level=moderate
      - name: Generate reproducible npm CycloneDX SBOM
        run: npm run sbom:npm
      - name: Enforce npm license allowlist and detect copyleft
        run: npm run audit:licenses:npm
      - name: Install pinned Rust audit tools
        run: |
          cargo install --locked cargo-audit --version 0.22.2
          cargo install --locked cargo-cyclonedx --version 0.5.9
          cargo install --locked cargo-deny --version 0.20.2
      - name: Audit Cargo advisories
        run: cargo audit --file apps/desktop/src-tauri/Cargo.lock
      - name: Enforce Cargo license allowlist
        run: >-
          cargo deny --manifest-path apps/desktop/src-tauri/Cargo.toml
          --config release/supply-chain/deny.toml check licenses
      - name: Generate Cargo CycloneDX SBOM
        run: |
          cargo cyclonedx --manifest-path apps/desktop/src-tauri/Cargo.toml --format json --spec-version 1.5
          node release/supply-chain/normalize-cyclonedx.mjs apps/desktop/src-tauri/iroha-pdf.cdx.json artifacts/cargo.cdx.json
      - name: Retain SBOM and license evidence
        uses: actions/upload-artifact@v7
        with:
          name: supply-chain-reports
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
  e2e:
    name: e2e (${{ matrix.os }})
    if: github.event_name != 'workflow_dispatch' || inputs.store_screenshots != true
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci

      # poppler and Ghostscript let the rendering suite confirm annotations are
      # visible outside pdfium. Where they are absent those tests skip themselves.
      - name: Install PDF rasterisers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils ghostscript imagemagick
      - name: Install PDF rasterisers (macOS)
        if: runner.os == 'macOS'
        run: brew install poppler ghostscript imagemagick

      - run: npx playwright install --with-deps chromium
        working-directory: apps/desktop
      # The quality job built this tree through Frost. Reuse those exact bytes
      # on every browser host rather than rebuilding an undeclared dist/ tree
      # with npm and allowing a stale local preview to pass.
      - uses: actions/download-artifact@v8
        with:
          name: quality-artifacts
          # upload-artifact removes the common `apps/` ancestor shared by the
          # desktop tree and Expo config; restore it when extracting.
          path: apps
      - name: Confirm the Frost web output is present
        shell: bash
        run: test -f apps/desktop/dist/debug/index.html
      - run: npm run e2e
        env:
          # Shared runners are slower than a developer machine; only time budgets scale.
          PERF_BUDGET_SCALE: '4'

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          retention-days: 14

  # The `e2e` job above substitutes the Tauri runtime: it is the real application
  # code, but the plugins beneath it are `apps/desktop/e2e/tauri-stub.ts` and the
  # engine renders in Chromium. This job substitutes nothing. It compiles the Rust
  # binary, drives it through tauri-driver and a real WebKitGTK webview, and reads
  # the bytes it leaves on disk — so what it proves is what only the real runtime
  # can: that the capability actually refuses `/etc/passwd`, that pdfium renders
  # under WebKit and not just Chromium, and that a save rewrites the file and keeps
  # the pristine original beside it. Twenty-two checks, all of them assertions.
  #
  # Not on the required list in scripts/github/protect-main.sh, deliberately: a job
  # that has never been green on this runner should not be able to block a merge on
  # its first day. Promote it once it has a record.
  #
  # Linux only. macOS would need a WKWebView driver and Windows an Edge one, and
  # neither is a copy of this job.
  e2e-tauri:
    name: Real-runtime e2e (ubuntu)
    if: github.event_name != 'workflow_dispatch' || inputs.store_screenshots != true
    runs-on: ubuntu-latest
    # Cold, the debug compile of the Tauri dependency tree dominates: 2m 24s on the
    # machine this was verified on, and a shared runner is slower.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          # Keyed apart from the `tauri` job's cache of the same workspace: that one
          # holds a release build, this one a debug build, and sharing a key would
          # have each evict the other's artifacts every run.
          key: debug
      # Byte-identical to the block in the `quality` and `tauri` jobs above; see the
      # note there. Raise the version in all of them together.
      - name: Install checksummed FrostBuild
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux)
              asset=frostbuild-v0.8.0-x86_64-unknown-linux-musl.tar.gz
              sha=7a70953d61831109daf66cc02f9e93ec2740db1c4fa8bc680530e8b5cae46795 ;;
            macOS)
              asset=frostbuild-v0.8.0-aarch64-apple-darwin.tar.gz
              sha=834b3d841e78e5a46851fb84202d49a6faaa5c0cc64d9b9e0cee0fd314d01bf6 ;;
            Windows)
              asset=frostbuild-v0.8.0-x86_64-pc-windows-msvc.zip
              sha=358e95577aa865b679cf35f31405ae9ffe2f4acc7b586f65cf5a253bd1394b31 ;;
            *)
              echo "::error::no pinned FrostBuild release for $RUNNER_OS"
              exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/frost"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/$asset" \
            "https://github.com/hjosugi/frost-build/releases/download/v0.8.0/$asset"
          case "$RUNNER_OS" in
            macOS) actual="$(shasum --algorithm 256 < "$RUNNER_TEMP/$asset" | cut -d' ' -f1)" ;;
            *)     actual="$(sha256sum < "$RUNNER_TEMP/$asset" | cut -d' ' -f1)" ;;
          esac
          if [[ "$actual" != "$sha" ]]; then
            echo "::error::$asset has sha256 $actual; the pin expects $sha"
            exit 1
          fi
          case "$asset" in
            *.zip)
              unzip -q -j "$RUNNER_TEMP/$asset" -d "$RUNNER_TEMP/frost" ;;
            *)
              tar --extract --gzip --file "$RUNNER_TEMP/$asset" \
                --directory "$RUNNER_TEMP/frost" --strip-components=1 ;;
          esac
          echo "$RUNNER_TEMP/frost" >> "$GITHUB_PATH"
      # The first line is the `tauri` job's list, because this compiles the same
      # crate. The second is what running it needs and bundling does not:
      # WebKitWebDriver is the native driver tauri-driver drives, xvfb is the
      # display the webview opens its window on, and pdftotext is how the last two
      # checks read the saved file back (they skip themselves without it).
      - name: Install Linux build and real-runtime dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
          webkit2gtk-driver xvfb poppler-utils
      # Pinned like every other tool here. tauri-driver is the WebDriver shim that
      # starts the application and forwards to WebKitWebDriver; 2.x is the series
      # that speaks to Tauri 2.
      - name: Install pinned tauri-driver
        run: cargo install tauri-driver --version 2.0.6 --locked
      - name: Install locked dependencies
        run: npm ci
      # Not a release packaging target: that produces installers, and the
      # harness cannot drive one — the seam it opens files through is compiled out
      # of a production frontend and the scope it needs is `debug_assertions`-only.
      # See the target's comment in frost.toml.
      - name: Build the debug binary through Frost
        run: frost build desktop-app-linux-debug --no-tui
      # `run.mjs` starts the Vite dev server the debug binary loads, builds the
      # fixture if this checkout has not got one, and exits non-zero on the first
      # failed check.
      - name: Run the real-runtime e2e under Xvfb
        run: xvfb-run -a npm run e2e:tauri

  # Not on pull_request: a cold build measured 42m 51s locally, most of it fetching the
  # 2 GB NDK and compiling native code. Gating every PR on that is not worth it, so this
  # runs on main and on demand. Caches should bring warm runs down substantially.
  android:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.store_screenshots != true)
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Matches the JDK 21 the local build was verified against.
          java-version: '21'
      - uses: android-actions/setup-android@v3

      - run: npm ci
      - name: Generate the native project
        run: npx expo prebuild --no-install --platform android
        working-directory: apps/mobile

      # Gradle pulls the NDK and cmake itself; caching them is what makes this bearable.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/Android/Sdk/ndk
            ~/Android/Sdk/cmake
          key: android-${{ runner.os }}-${{ hashFiles('apps/mobile/package.json') }}
          restore-keys: android-${{ runner.os }}-

      - name: Build the debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/mobile/android

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # Deliberately manual: this builds a release APK, generates a real 300 MiB /
  # 500-page PDF, and boots a 1.5 GiB AVD. It is evidence for the release gate,
  # not a fast simulation folded into unit tests. The app must survive Android's
  # critical trim signal, background/resume, and a process-cold reopen.
  android-low-memory:
    name: Android low-memory evidence
    if: github.event_name == 'workflow_dispatch' && inputs.store_screenshots != true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_PUBLIC_DEVICE_EVIDENCE: '1'
      IROHA_DEVICE_EVIDENCE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Allow KVM acceleration
        run: |
          set -euo pipefail
          [[ -e /dev/kvm ]] || { echo '/dev/kvm is unavailable' >&2; exit 1; }
          sudo chown "$USER" /dev/kvm
      - name: Install locked dependencies and Android image
        run: |
          set -euo pipefail
          npm ci
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd-low-memory"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            emulator \
            'system-images;android-36;default;x86_64'
          echo no | avdmanager create avd \
            --force \
            --name iroha-low-memory \
            --package 'system-images;android-36;default;x86_64' \
            --device pixel_6
      - name: Generate the evidence-only native project
        run: |
          npx expo prebuild --platform android --no-install --clean
          node ../../release/device-evidence/prepare-stylus-instrumentation.mjs
        working-directory: apps/mobile
        env:
          EXPO_NO_DOCTOR: '1'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/Android/Sdk/ndk
            ~/Android/Sdk/cmake
          key: low-memory-android-${{ runner.os }}-${{ hashFiles('apps/mobile/package.json') }}
          restore-keys: android-${{ runner.os }}-
      - name: Build the x86_64 release APK and stylus instrumentation
        run: >-
          ./gradlew assembleRelease assembleReleaseAndroidTest --no-daemon
          -PreactNativeArchitectures=x86_64
        working-directory: apps/mobile/android
      - name: Generate the 300 MiB / 500-page fixture
        run: >-
          node release/device-evidence/generate-large-pdf.mjs
          --pages 500 --size-mib 300
          --output ${{ runner.temp }}/large-500-pages.pdf
      - name: Boot the 1.5 GiB emulator and install
        run: |
          set -euo pipefail
          adb start-server
          nohup "$ANDROID_SDK_ROOT/emulator/emulator" @iroha-low-memory \
            -no-window -noaudio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -camera-back none -camera-front none \
            -lowram -memory 1536 > "$RUNNER_TEMP/android-low-memory-emulator.log" 2>&1 &
          emulator_pid=$!
          for _ in $(seq 1 180); do
            [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]] && break
            kill -0 "$emulator_pid" 2>/dev/null || {
              cat "$RUNNER_TEMP/android-low-memory-emulator.log"
              exit 1
            }
            sleep 2
          done
          [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]
          # The evidence does not use Play services. A plain AOSP image avoids
          # first-boot Google provisioning consuming the entire 1.5 GiB budget
          # before the app process starts. Finish OS setup and remove animation
          # timing from the UI-automation measurements.
          adb shell settings put global device_provisioned 1
          adb shell settings put secure user_setup_complete 1
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          adb shell pm list packages >/dev/null
          adb install -r apps/mobile/android/app/build/outputs/apk/release/app-release.apk
      - name: Exercise open, trim, resume, and cold reopen
        run: >-
          bash release/device-evidence/verify-low-memory-android.sh
          artifacts/device-evidence
          ${{ runner.temp }}/large-500-pages.pdf
      - name: Inject native pen pressure and verify the SQLite payload
        shell: bash
        run: |
          set -euo pipefail
          test_apk="$(find apps/mobile/android/app/build/outputs/apk/androidTest -name '*.apk' -print -quit)"
          [[ -n "$test_apk" ]] || { echo 'stylus instrumentation APK not found' >&2; exit 1; }
          adb install -r "$test_apk"
          set +e
          adb shell am instrument -w -r \
            -e class app.irohapdf.mobile.StylusInputTest \
            app.irohapdf.mobile.test/androidx.test.runner.AndroidJUnitRunner \
            | tee artifacts/device-evidence/stylus-instrumentation.txt
          instrumentation_status="${PIPESTATUS[0]}"
          set -e
          # Instrumentation and the target app have separate Android UIDs. Read
          # the test UID's private files with run-as: Android's scoped-storage
          # policy can make an otherwise valid external-files path unpullable.
          pull_stylus_evidence() {
            local remote_name="$1"
            local local_path="$2"
            if adb exec-out run-as app.irohapdf.mobile.test \
              cat "files/device-evidence/$remote_name" > "$local_path"; then
              [[ -s "$local_path" ]] || rm -f "$local_path"
            else
              rm -f "$local_path"
            fi
          }
          pull_stylus_evidence stylus-pressure.png artifacts/device-evidence/stylus-pressure.png
          pull_stylus_evidence stylus-window.xml artifacts/device-evidence/stylus-window.xml
          png_magic="$(od -An -tx1 -N8 artifacts/device-evidence/stylus-pressure.png 2>/dev/null | tr -d ' \n')"
          if [[ "$png_magic" != 89504e470d0a1a0a ]]; then
            adb exec-out screencap -p > artifacts/device-evidence/stylus-pressure.png
          fi
          if ! grep -q '<hierarchy' artifacts/device-evidence/stylus-window.xml 2>/dev/null; then
            adb shell uiautomator dump /data/local/tmp/iroha-stylus-window.xml >/dev/null
            adb pull /data/local/tmp/iroha-stylus-window.xml \
              artifacts/device-evidence/stylus-window.xml >/dev/null
          fi
          (( instrumentation_status == 0 ))
          grep -q '^OK (1 test)' artifacts/device-evidence/stylus-instrumentation.txt
          png_magic="$(od -An -tx1 -N8 artifacts/device-evidence/stylus-pressure.png | tr -d ' \n')"
          [[ "$png_magic" == 89504e470d0a1a0a ]]
          grep -q '<hierarchy' artifacts/device-evidence/stylus-window.xml
      - name: Collect the emulator log
        if: always()
        run: |
          mkdir -p artifacts/device-evidence
          cp "$RUNNER_TEMP/android-low-memory-emulator.log" \
            artifacts/device-evidence/emulator.log 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-low-memory-evidence
          path: artifacts/device-evidence/
          if-no-files-found: error
          retention-days: 90

  store-screenshots:
    name: Native store screenshot set
    if: github.event_name == 'workflow_dispatch' && inputs.store_screenshots == true
    uses: ./.github/workflows/store-screenshots.yml
