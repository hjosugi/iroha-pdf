name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.13.0
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality and Expo validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: go-task/setup-task@v2.1.0
        with:
          version: 3.52.0
      # Byte-identical to the block in the `tauri` job below and in
      # .github/workflows/release.yml. It runs on three operating systems there,
      # so it is written once and copied rather than kept in two shapes; raise
      # the version in all three together with FROST_VERSION in Taskfile.yml.
      - name: Install checksummed FrostBuild
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux)
              asset=frostbuild-v0.8.0-x86_64-unknown-linux-musl.tar.gz
              sha=7a70953d61831109daf66cc02f9e93ec2740db1c4fa8bc680530e8b5cae46795 ;;
            macOS)
              asset=frostbuild-v0.8.0-aarch64-apple-darwin.tar.gz
              sha=834b3d841e78e5a46851fb84202d49a6faaa5c0cc64d9b9e0cee0fd314d01bf6 ;;
            Windows)
              asset=frostbuild-v0.8.0-x86_64-pc-windows-msvc.zip
              sha=358e95577aa865b679cf35f31405ae9ffe2f4acc7b586f65cf5a253bd1394b31 ;;
            *)
              echo "::error::no pinned FrostBuild release for $RUNNER_OS"
              exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/frost"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/$asset" \
            "https://github.com/hjosugi/frost-build/releases/download/v0.8.0/$asset"
          # Chosen by runner, not by which binary exists: macOS has a
          # `sha256sum`, but a BSD one that rejects `--check` and the
          # "digest  path" line GNU reads, so probing for the name picks a tool
          # that cannot do the job. Compared as strings so no --check dialect
          # is involved at all.
          # Read from stdin, not by name. GNU sha256sum escapes a filename
          # containing a backslash and marks the line by prefixing the digest
          # with one, and every Windows path has backslashes — the digest then
          # compares unequal to an identical pin. With stdin there is no
          # filename in the output to escape.
          case "$RUNNER_OS" in
            macOS) actual="$(shasum --algorithm 256 < "$RUNNER_TEMP/$asset" | cut -d' ' -f1)" ;;
            *)     actual="$(sha256sum < "$RUNNER_TEMP/$asset" | cut -d' ' -f1)" ;;
          esac
          if [[ "$actual" != "$sha" ]]; then
            echo "::error::$asset has sha256 $actual; the pin expects $sha"
            exit 1
          fi
          case "$asset" in
            *.zip)
              unzip -q -j "$RUNNER_TEMP/$asset" -d "$RUNNER_TEMP/frost" ;;
            *)
              tar --extract --gzip --file "$RUNNER_TEMP/$asset" \
                --directory "$RUNNER_TEMP/frost" --strip-components=1 ;;
          esac
          echo "$RUNNER_TEMP/frost" >> "$GITHUB_PATH"
      - name: Install locked dependencies
        run: npm ci
      - name: Run Task/Frost quality workflow
        run: task ci
      - name: Resolve public Expo config
        run: npx expo config --type public --json > expo-config.json
        working-directory: apps/mobile
      - name: Validate Android prebuild
        run: npx expo prebuild --platform android --no-install --clean
        working-directory: apps/mobile
        env:
          EXPO_NO_DOCTOR: "1"
      - name: Retain web build and resolved Expo config
        uses: actions/upload-artifact@v4
        with:
          name: quality-artifacts
          path: |
            apps/desktop/dist/
            apps/mobile/expo-config.json
          if-no-files-found: error
          retention-days: 14

  # This job used to run a bare `cargo build --release`: a compile with no
  # declared inputs, no relationship to `desktop-web`, and no packaging, which
  # meant nothing ever proved the installers a release ships can be produced at
  # all. It now runs the same Frost target the Release workflow runs, so a
  # bundler that breaks breaks here, on the pull request, and not halfway
  # through cutting a release.
  #
  # The job name is load-bearing: scripts/github/protect-main.sh requires
  # `Tauri (<os>)` on main and .github/workflows/release.yml reads that list to
  # decide whether a commit is releasable. Renaming it silently weakens both.
  tauri:
    name: Tauri (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Was 45 for a compile. Bundling adds three bundlers on Linux, WiX and NSIS
    # downloads on Windows, and a second architecture on macOS.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Add the second macOS architecture
        if: runner.os == 'macOS'
        # `desktop-app-macos` builds `universal-apple-darwin`, which needs both
        # slices' standard libraries. No credentials are involved.
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - uses: go-task/setup-task@v2.1.0
        with:
          version: 3.52.0
      - name: Install checksummed FrostBuild
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux)
              asset=frostbuild-v0.8.0-x86_64-unknown-linux-musl.tar.gz
              sha=7a70953d61831109daf66cc02f9e93ec2740db1c4fa8bc680530e8b5cae46795 ;;
            macOS)
              asset=frostbuild-v0.8.0-aarch64-apple-darwin.tar.gz
              sha=834b3d841e78e5a46851fb84202d49a6faaa5c0cc64d9b9e0cee0fd314d01bf6 ;;
            Windows)
              asset=frostbuild-v0.8.0-x86_64-pc-windows-msvc.zip
              sha=358e95577aa865b679cf35f31405ae9ffe2f4acc7b586f65cf5a253bd1394b31 ;;
            *)
              echo "::error::no pinned FrostBuild release for $RUNNER_OS"
              exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/frost"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/$asset" \
            "https://github.com/hjosugi/frost-build/releases/download/v0.8.0/$asset"
          # Chosen by runner, not by which binary exists: macOS has a
          # `sha256sum`, but a BSD one that rejects `--check` and the
          # "digest  path" line GNU reads, so probing for the name picks a tool
          # that cannot do the job. Compared as strings so no --check dialect
          # is involved at all.
          # Read from stdin, not by name. GNU sha256sum escapes a filename
          # containing a backslash and marks the line by prefixing the digest
          # with one, and every Windows path has backslashes — the digest then
          # compares unequal to an identical pin. With stdin there is no
          # filename in the output to escape.
          case "$RUNNER_OS" in
            macOS) actual="$(shasum --algorithm 256 < "$RUNNER_TEMP/$asset" | cut -d' ' -f1)" ;;
            *)     actual="$(sha256sum < "$RUNNER_TEMP/$asset" | cut -d' ' -f1)" ;;
          esac
          if [[ "$actual" != "$sha" ]]; then
            echo "::error::$asset has sha256 $actual; the pin expects $sha"
            exit 1
          fi
          case "$asset" in
            *.zip)
              unzip -q -j "$RUNNER_TEMP/$asset" -d "$RUNNER_TEMP/frost" ;;
            *)
              tar --extract --gzip --file "$RUNNER_TEMP/$asset" \
                --directory "$RUNNER_TEMP/frost" --strip-components=1 ;;
          esac
          echo "$RUNNER_TEMP/frost" >> "$GITHUB_PATH"
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        # `xdg-utils` is new: the AppImage bundler copies /usr/bin/xdg-open into
        # the AppDir and fails outright without it. The rest is unchanged;
        # patchelf is what rewrites the rpath of the binaries it copies in.
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Install locked dependencies
        run: npm ci
      # Builds the desktop-web tree through the graph and then bundles it. The
      # Vite build is a Frost dependency of the packaging target, so there is no
      # separate web-asset step here any more.
      - name: Build and bundle the desktop app through Frost
        run: task bundle:desktop
      - name: Retain the desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: desktop-packages-${{ runner.os }}
          path: apps/desktop/bundle/release/
          if-no-files-found: error
          retention-days: 14

  supply-chain:
    name: Supply-chain policy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Install locked dependencies
        run: npm ci
      - name: Verify temporary dependency patches
        run: npm run verify:dependency-patches
      - name: Audit npm advisories
        # libxmljs2 is an optional XML validator of the dev-only CycloneDX
        # library. The project emits JSON SBOMs; audit the installed product
        # graph without treating that unused optional peer as shipped code.
        run: npm audit --omit=optional --audit-level=moderate
      - name: Generate reproducible npm CycloneDX SBOM
        run: npm run sbom:npm
      - name: Enforce npm license allowlist and detect copyleft
        run: npm run audit:licenses:npm
      - name: Install pinned Rust audit tools
        run: |
          cargo install --locked cargo-audit --version 0.22.2
          cargo install --locked cargo-cyclonedx --version 0.5.9
          cargo install --locked cargo-deny --version 0.20.2
      - name: Audit Cargo advisories
        run: cargo audit --file apps/desktop/src-tauri/Cargo.lock
      - name: Enforce Cargo license allowlist
        run: >-
          cargo deny --manifest-path apps/desktop/src-tauri/Cargo.toml
          --config release/supply-chain/deny.toml check licenses
      - name: Generate Cargo CycloneDX SBOM
        run: |
          cargo cyclonedx --manifest-path apps/desktop/src-tauri/Cargo.toml --format json --spec-version 1.5
          node release/supply-chain/normalize-cyclonedx.mjs apps/desktop/src-tauri/iroha-pdf.cdx.json artifacts/cargo.cdx.json
      - name: Retain SBOM and license evidence
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-reports
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci

      # poppler and Ghostscript let the rendering suite confirm annotations are
      # visible outside pdfium. Where they are absent those tests skip themselves.
      - name: Install PDF rasterisers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils ghostscript imagemagick
      - name: Install PDF rasterisers (macOS)
        if: runner.os == 'macOS'
        run: brew install poppler ghostscript imagemagick

      - run: npx playwright install --with-deps chromium
        working-directory: apps/desktop
      - run: npm run build:desktop
      - run: npm run e2e
        env:
          # Shared runners are slower than a developer machine; only time budgets scale.
          PERF_BUDGET_SCALE: '4'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          retention-days: 14

  # Not on pull_request: a cold build measured 42m 51s locally, most of it fetching the
  # 2 GB NDK and compiling native code. Gating every PR on that is not worth it, so this
  # runs on main and on demand. Caches should bring warm runs down substantially.
  android:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Matches the JDK 21 the local build was verified against.
          java-version: '21'
      - uses: android-actions/setup-android@v3

      - run: npm ci
      - name: Generate the native project
        run: npx expo prebuild --no-install --platform android
        working-directory: apps/mobile

      # Gradle pulls the NDK and cmake itself; caching them is what makes this bearable.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/Android/Sdk/ndk
            ~/Android/Sdk/cmake
          key: android-${{ runner.os }}-${{ hashFiles('apps/mobile/package.json') }}
          restore-keys: android-${{ runner.os }}-

      - name: Build the debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/mobile/android

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
