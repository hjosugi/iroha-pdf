name: Pages

# Publishes the repository's own documentation. The site is generated by
# `site/build.mjs` from the Markdown in `docs/` and the repository root, so the
# published page and the reviewed file are the same text and cannot drift.
#
# One of these URLs is load-bearing outside this repository:
# https://hjosugi.github.io/iroha-pdf/privacy/ is the privacy-policy address
# entered in App Store Connect, Play Console, and the OAuth consent screen (see
# docs/STORE_PRIVACY_CHECKLIST.md). `site/verify.mjs` fails the build if it
# stops resolving, so a refactor cannot quietly 404 a URL a store is holding.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; the deploy job widens this for itself alone.
permissions:
  contents: read

# Deployments are serialised and never cancelled: cancelling one mid-flight can
# leave the live site on a half-uploaded artifact.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: 22.13.0

jobs:
  build:
    name: Build and check the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Resolves the origin the site will actually be served from, so canonical
      # links and sitemap.xml are right even if the repository or owner is
      # renamed. Skipped on pull requests: it requires Pages to be enabled, and
      # a fork's PR must still be able to prove the site builds.
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      # No dependencies to install: the generator is plain Node with no imports
      # outside this repository, which is also why nothing here runs `npm ci`.
      - name: Build the documentation site
        run: node site/build.mjs --out site/dist
        env:
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url }}

      # Refuses a site with a broken internal link, a dangling anchor, an
      # off-origin subresource, or a missing privacy-policy page.
      - name: Check links, anchors, and the no-off-origin rule
        run: node site/verify.mjs site/dist

      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A job-level block replaces the workflow default rather than adding to it,
    # so `contents: read` is restated here.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
