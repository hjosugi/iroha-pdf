# Generated from npm workspace metadata with FrostBuild v0.8.0, then extended
# with an explicit Vite output-tree boundary for the desktop web build and with
# the release-facing validation gates, which read checked-in configuration and
# assets rather than a workspace script.

[workspace]
name = "iroha-pdf"
default_targets = ["desktop-web"]

[toolchain.tools]
npm = "npm"
node = "node"

# Windows names npm `npm.cmd`, and a `command` target is spawned directly rather
# than through a shell, so the bare name cannot be located there — the Windows
# runner failed with `failed to spawn "npm": program not found` while `npm ci`
# in the adjacent step worked. Naming the tool per platform is the documented
# way to say that; `pass_env` cannot fix it, because the name is resolved before
# the action environment applies. Selected by `task bundle:desktop`, which
# passes `--platform windows` only on a Windows host, so the Linux and macOS
# builds keep the root toolchain and their existing output paths untouched.
[platform.windows.tools]
npm = "npm.cmd"
node = "node.exe"

[target.iroha-pdf-brand-validate]
kind = "test"
tool = "node"
args = ["release/branding/validate-assets.mjs"]
inputs = [
  # The desktop shell inlines the mark as a data URI, so it is brand surface and
  # editing it must rerun this gate.
  "apps/desktop/index.html",
  "apps/desktop/src-tauri/icons/128x128.png",
  "apps/desktop/src-tauri/icons/128x128@2x.png",
  "apps/desktop/src-tauri/icons/32x32.png",
  "apps/desktop/src-tauri/icons/icon.icns",
  "apps/desktop/src-tauri/icons/icon.ico",
  "apps/mobile/app.json",
  "apps/mobile/assets/fonts/*.otf",
  "apps/mobile/assets/images/*.png",
  "apps/mobile/plugins/*.js",
  "assets/branding/*",
  "release/branding/validate-assets.mjs",
  "release/store/screenshots/desktop/*.png",
  "release/store/play/*.png",
]
env = { CI = "true" }
pass_env = ["NODE_OPTIONS", "NODE_PATH", "NPM_CONFIG_CACHE", "NPM_CONFIG_USERCONFIG", "COREPACK_HOME", "FORCE_COLOR"]
sandbox = false

# The store listing is a release input, so screenshots, localized copy, fixture
# provenance, and the generator that makes the screenshots reproducible form a
# separate test boundary. Keeping it separate from the brand icon gate makes a
# stale description or a translucent simulator capture fail for the right
# reason instead of being hidden inside an icon count.
[target.iroha-pdf-store-validate]
kind = "test"
tool = "node"
args = ["release/store/validate-submission-assets.mjs"]
inputs = [
  ".github/workflows/store-screenshots.yml",
  "apps/mobile/assets/store/iroha-demo.pdf",
  "apps/mobile/src/app/store-preview.tsx",
  "release/store/capture-android.sh",
  "release/store/capture-ios.sh",
  "release/store/fixtures/generate.mjs",
  "release/store/listing/*.json",
  "release/store/screenshots/**/*.json",
  "release/store/screenshots/**/*.png",
  "release/store/validate-submission-assets.mjs",
]
env = { CI = "true" }
pass_env = ["NODE_OPTIONS", "NODE_PATH", "NPM_CONFIG_CACHE", "NPM_CONFIG_USERCONFIG", "COREPACK_HOME", "FORCE_COLOR"]
sandbox = false

# Builds the GitHub Pages documentation site into a temporary directory and
# refuses a broken internal link, a dangling anchor, an off-origin subresource,
# or a missing /privacy/ page. Its inputs are the documents it publishes, so
# editing one reruns this and nothing else. `site/dist/` is deliberately absent:
# the gate builds its own copy and never reads a checked-out output tree.
[target.iroha-pdf-site-build]
kind = "test"
tool = "node"
args = ["site/verify.mjs"]
inputs = [
  "CHANGELOG.md",
  "SECURITY.md",
  "THIRD_PARTY_NOTICES.md",
  "apps/mobile/assets/images/icon.png",
  "assets/branding/iroha-icon.svg",
  "docs/*.md",
  "package.json",
  "site/assets/site.css",
  "site/build.mjs",
  "site/catalog.mjs",
  "site/markdown.mjs",
  "site/verify.mjs",
]
env = { CI = "true" }
pass_env = ["NODE_OPTIONS", "NODE_PATH", "NPM_CONFIG_CACHE", "NPM_CONFIG_USERCONFIG", "COREPACK_HOME", "FORCE_COLOR"]
sandbox = false

[target.iroha-pdf-core-test]
kind = "test"
tool = "npm"
args = ["run", "test", "--workspace", "@iroha-pdf/core"]
inputs = ["package-lock.json", "package.json", "packages/core/*", "packages/core/src/**/*", "tsconfig.base.json"]
env = { CI = "true" }
pass_env = ["NODE_OPTIONS", "NODE_PATH", "NPM_CONFIG_CACHE", "NPM_CONFIG_USERCONFIG", "COREPACK_HOME", "FORCE_COLOR"]
