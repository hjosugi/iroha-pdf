[target.desktop-web]
kind = "command"
tool = "npm"
args = ["--prefix", "apps/desktop", "run", "build", "--", "--outDir", "dist/${config}"]
inputs = [
  "package-lock.json",
  "package.json",
  "tsconfig.base.json",
  "apps/desktop/index.html",
  "apps/desktop/package.json",
  "apps/desktop/src/**/*",
  "apps/desktop/tsconfig.json",
  "apps/desktop/vite.config.ts",
  "packages/core/package.json",
  "packages/core/src/**/*",
  "packages/google-drive/package.json",
  "packages/google-drive/src/**/*",
]
output_dirs = ["apps/desktop/dist/${config}"]
env = { CI = "true" }
pass_env = ["PATH", "PATHEXT", "NODE_OPTIONS", "NODE_PATH", "NPM_CONFIG_CACHE", "NPM_CONFIG_USERCONFIG", "COREPACK_HOME", "FORCE_COLOR"]
sandbox = false

# Desktop packaging. `tauri build` compiles the Rust binary and then runs every
# bundler that `bundle.targets: "all"` selects for the host, so what comes out
# is host-specific: .AppImage/.deb/.rpm on Linux, .dmg on macOS, .msi and an
# NSIS .exe on Windows. Frost has no per-host conditional inside a single
# target, and hiding the difference inside a script that branches on
# `process.platform` would put the bundler invocation back outside the graph —
# the thing this target exists to stop. So there is one target per host, and the
# only difference between them is visible here: the macOS universal flag, and
# the Cargo output directory that flag implies.
#
# Two overrides are pushed in through `--config`, which tauri merges over
# tauri.conf.json. `beforeBuildCommand` is emptied and `frontendDist` is aimed
# at the desktop-web output tree, so the web assets come from the graph through
# `deps` rather than from tauri shelling out to npm behind Frost's back — the
# same output-tree boundary the desktop-web target draws, now actually consumed.
# The trailing `-- --locked` reaches cargo and keeps Cargo.lock authoritative.
#
# That tree reaches these targets through `deps` and not through `inputs`: Frost
# resolves input globs before it builds dependencies, so naming
# `apps/desktop/dist/${config}/**/*` here would fail on a clean checkout, where
# it has not been produced yet. `deps` is what carries it — desktop-web declares
# the tree as its `output_dirs`, and its digest is part of this action's key.
#
# Frost spawns tools directly rather than through a shell, so the `--config`
# JSON reaches npm as one argv element; npm's own script runner is the only hop
# that has to quote it again, which is the same hop `desktop-web` already goes
# through. Verified on Linux; the Windows and macOS runs are CI's to prove.
#
# The bundles land in Cargo's target directory, whose layout carries no Frost
# profile and so cannot be an `output_dirs` entry; the collect step copies them
# to `apps/desktop/bundle/${config}`, which can be, and checks on the way that
# the host produced its full set at the version tauri.conf.json declares.

[target.desktop-app-linux]
kind = "command"
tool = "npm"
args = [
  "--prefix", "apps/desktop", "run", "tauri:build", "--",
  "--ci",
  "--config", "{\"build\":{\"beforeBuildCommand\":\"\",\"frontendDist\":\"../dist/${config}\"}}",
  "--", "--locked",
]
steps = [
  { tool = "node", args = [
    "release/desktop/collect-bundles.mjs",
    "apps/desktop/src-tauri/target/release/bundle",
    "apps/desktop/bundle/${config}",
  ] },
]
deps = ["desktop-web"]
inputs = [
  "apps/desktop/package.json",
  "apps/desktop/src-tauri/Cargo.lock",
  "apps/desktop/src-tauri/Cargo.toml",
  "apps/desktop/src-tauri/build.rs",
  "apps/desktop/src-tauri/capabilities/**/*",
  "apps/desktop/src-tauri/icons/*",
  "apps/desktop/src-tauri/src/**/*",
  "apps/desktop/src-tauri/tauri.conf.json",
  "apps/desktop/src-tauri/vendor/**/*",
  "package-lock.json",
  "package.json",
  "release/desktop/collect-bundles.mjs",
]
output_dirs = ["apps/desktop/bundle/${config}"]
env = { CI = "true" }
pass_env = ["NODE_OPTIONS", "NODE_PATH", "NPM_CONFIG_CACHE", "NPM_CONFIG_USERCONFIG", "COREPACK_HOME", "FORCE_COLOR", "PATH", "CARGO_HOME", "CARGO_TERM_COLOR", "RUSTUP_HOME", "RUSTUP_TOOLCHAIN", "TMPDIR", "TEMP", "TMP", "USERPROFILE", "APPDATA", "LOCALAPPDATA", "PROGRAMDATA", "PROGRAMFILES", "SYSTEMROOT", "WINDIR", "COMSPEC", "PATHEXT", "DEVELOPER_DIR", "SDKROOT", "MACOSX_DEPLOYMENT_TARGET"]
sandbox = false

# `macos-latest` runners are arm64, so a plain build would ship Apple silicon
# only. `--target universal-apple-darwin` lipos both slices into one binary and
# needs nothing but the second standard library — no certificate, no Apple ID,
# no notarization credentials. It also moves the bundle tree under that triple.
[target.desktop-app-macos]
kind = "command"
tool = "npm"
args = [
  "--prefix", "apps/desktop", "run", "tauri:build", "--",
  "--ci", "--target", "universal-apple-darwin",
  "--config", "{\"build\":{\"beforeBuildCommand\":\"\",\"frontendDist\":\"../dist/${config}\"}}",
  "--", "--locked",
]
steps = [
  { tool = "node", args = [
    "release/desktop/collect-bundles.mjs",
    "apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle",
    "apps/desktop/bundle/${config}",
  ] },
]
deps = ["desktop-web"]
inputs = [
  "apps/desktop/package.json",
  "apps/desktop/src-tauri/Cargo.lock",
  "apps/desktop/src-tauri/Cargo.toml",
  "apps/desktop/src-tauri/build.rs",
  "apps/desktop/src-tauri/capabilities/**/*",
  "apps/desktop/src-tauri/icons/*",
  "apps/desktop/src-tauri/src/**/*",
  "apps/desktop/src-tauri/tauri.conf.json",
  "apps/desktop/src-tauri/vendor/**/*",
  "package-lock.json",
  "package.json",
  "release/desktop/collect-bundles.mjs",
]
output_dirs = ["apps/desktop/bundle/${config}"]
env = { CI = "true" }
pass_env = ["NODE_OPTIONS", "NODE_PATH", "NPM_CONFIG_CACHE", "NPM_CONFIG_USERCONFIG", "COREPACK_HOME", "FORCE_COLOR", "PATH", "CARGO_HOME", "CARGO_TERM_COLOR", "RUSTUP_HOME", "RUSTUP_TOOLCHAIN", "TMPDIR", "TEMP", "TMP", "USERPROFILE", "APPDATA", "LOCALAPPDATA", "PROGRAMDATA", "PROGRAMFILES", "SYSTEMROOT", "WINDIR", "COMSPEC", "PATHEXT", "DEVELOPER_DIR", "SDKROOT", "MACOSX_DEPLOYMENT_TARGET"]
sandbox = false

