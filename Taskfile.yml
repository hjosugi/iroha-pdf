version: '3'

vars:
  FROST_BIN: '{{default "frost" .FROST_BIN}}'
  # The pinned toolchain. CI installs this exact checksummed release, and the
  # preconditions below refuse a different one: before 1.0 a Frost minor may
  # change manifest or CLI semantics, so "some frost is on PATH" is not enough
  # to make a local run mean the same thing as the CI run.
  FROST_VERSION: '0.8.0'

tasks:
  default:
    desc: Run all fast validation gates
    cmds:
      - task: check

  install:
    desc: Install the locked npm dependency graph
    cmds:
      - npm ci

  check:
    desc: Run every cached Frost test, typecheck, and release-validation gate
    preconditions:
      - sh: command -v "{{.FROST_BIN}}"
        msg: Install FrostBuild v{{.FROST_VERSION}}; see docs/BUILD.md
      - sh: test "$("{{.FROST_BIN}}" info version)" = "{{.FROST_VERSION}}"
        msg: This workspace is pinned to FrostBuild v{{.FROST_VERSION}}; see docs/BUILD.md
      - sh: test -d node_modules
        msg: Run `task install` first
    cmds:
      - '{{.FROST_BIN}} test --all --no-tui'

  test:
    desc: Run the cached unit-test gates
    preconditions:
      - sh: command -v "{{.FROST_BIN}}"
        msg: Install FrostBuild v{{.FROST_VERSION}}; see docs/BUILD.md
      - sh: test "$("{{.FROST_BIN}}" info version)" = "{{.FROST_VERSION}}"
        msg: This workspace is pinned to FrostBuild v{{.FROST_VERSION}}; see docs/BUILD.md
      - sh: test -d node_modules
        msg: Run `task install` first
    cmds:
      - >-
        {{.FROST_BIN}} test --no-tui
        iroha-pdf-core-test
        iroha-pdf-google-drive-test
        iroha-pdf-desktop-test
        iroha-pdf-mobile-test

  typecheck:
    desc: Run the cached TypeScript gates
    preconditions:
      - sh: command -v "{{.FROST_BIN}}"
        msg: Install FrostBuild v{{.FROST_VERSION}}; see docs/BUILD.md
      - sh: test "$("{{.FROST_BIN}}" info version)" = "{{.FROST_VERSION}}"
        msg: This workspace is pinned to FrostBuild v{{.FROST_VERSION}}; see docs/BUILD.md
      - sh: test -d node_modules
        msg: Run `task install` first
    cmds:
      - >-
        {{.FROST_BIN}} test --no-tui
        iroha-pdf-core-typecheck
        iroha-pdf-google-drive-typecheck
        iroha-pdf-desktop-typecheck
        iroha-pdf-mobile-typecheck

  build:desktop:
    desc: Build and cache the desktop web output tree with Frost
    preconditions:
      - sh: command -v "{{.FROST_BIN}}"
        msg: Install FrostBuild v{{.FROST_VERSION}}; see docs/BUILD.md
      - sh: test "$("{{.FROST_BIN}}" info version)" = "{{.FROST_VERSION}}"
        msg: This workspace is pinned to FrostBuild v{{.FROST_VERSION}}; see docs/BUILD.md
      - sh: test -d node_modules
        msg: Run `task install` first
    cmds:
      - '{{.FROST_BIN}} build desktop-web --no-tui'

  validate:
    desc: Validate release-facing EAS, brand, and dependency-patch policy
    preconditions:
      - sh: command -v "{{.FROST_BIN}}"
        msg: Install FrostBuild v{{.FROST_VERSION}}; see docs/BUILD.md
      - sh: test "$("{{.FROST_BIN}}" info version)" = "{{.FROST_VERSION}}"
        msg: This workspace is pinned to FrostBuild v{{.FROST_VERSION}}; see docs/BUILD.md
      - sh: test -d node_modules
        msg: Run `task install` first
    cmds:
      - >-
        {{.FROST_BIN}} test --no-tui
        iroha-pdf-eas-validate
        iroha-pdf-brand-validate
        iroha-pdf-dependency-patches

  ci:
    desc: Run the deterministic CI quality workflow
    cmds:
      - task: check
      - task: build:desktop
      - task: validate

  # Deliberately without the pinned-version precondition: this is the task you
  # run when a gate has just refused your binary, so it has to be able to run
  # against the wrong one. `info` comes last because a pre-0.8 Frost does not
  # have that subcommand, and its diagnostics are still worth printing first.
  frost:doctor:
    desc: Diagnose the local Frost toolchain and workspace
    preconditions:
      - sh: command -v "{{.FROST_BIN}}"
        msg: Install FrostBuild v{{.FROST_VERSION}}; see docs/BUILD.md
    cmds:
      - '{{.FROST_BIN}} --version'
      - '{{.FROST_BIN}} doctor'
      - '{{.FROST_BIN}} info'

  github:protect-main:
    desc: Preview or apply the required GitHub main-branch protection
    cmds:
      - APPLY="{{default "0" .APPLY}}" scripts/github/protect-main.sh
