version: '3'

vars:
  FROST_BIN: '{{default "frost" .FROST_BIN}}'

tasks:
  default:
    desc: Run all fast validation gates
    cmds:
      - task: check

  install:
    desc: Install the locked npm dependency graph
    cmds:
      - npm ci

  check:
    desc: Run every cached Frost test and typecheck gate
    preconditions:
      - sh: command -v "{{.FROST_BIN}}"
        msg: Install FrostBuild v0.5.0; see docs/BUILD.md
      - sh: test -d node_modules
        msg: Run `task install` first
    cmds:
      - '{{.FROST_BIN}} test --all --no-tui'

  test:
    desc: Run the cached unit-test gates
    preconditions:
      - sh: command -v "{{.FROST_BIN}}"
        msg: Install FrostBuild v0.5.0; see docs/BUILD.md
      - sh: test -d node_modules
        msg: Run `task install` first
    cmds:
      - >-
        {{.FROST_BIN}} test --no-tui
        iroha-pdf-core-test
        iroha-pdf-google-drive-test
        iroha-pdf-desktop-test

  typecheck:
    desc: Run the cached TypeScript gates
    preconditions:
      - sh: command -v "{{.FROST_BIN}}"
        msg: Install FrostBuild v0.5.0; see docs/BUILD.md
      - sh: test -d node_modules
        msg: Run `task install` first
    cmds:
      - >-
        {{.FROST_BIN}} test --no-tui
        iroha-pdf-core-typecheck
        iroha-pdf-google-drive-typecheck
        iroha-pdf-desktop-typecheck
        iroha-pdf-mobile-typecheck

  build:desktop:
    desc: Build and cache the desktop web output tree with Frost
    preconditions:
      - sh: command -v "{{.FROST_BIN}}"
        msg: Install FrostBuild v0.5.0; see docs/BUILD.md
      - sh: test -d node_modules
        msg: Run `task install` first
    cmds:
      - '{{.FROST_BIN}} build desktop-web --no-tui'

  validate:
    desc: Validate release-facing EAS and brand assets
    preconditions:
      - sh: test -d node_modules
        msg: Run `task install` first
    cmds:
      - npm run validate:eas
      - npm run validate:brand

  ci:
    desc: Run the deterministic CI quality workflow
    cmds:
      - task: check
      - task: build:desktop
      - task: validate

  frost:doctor:
    desc: Diagnose the local Frost toolchain and workspace
    preconditions:
      - sh: command -v "{{.FROST_BIN}}"
        msg: Install FrostBuild v0.5.0; see docs/BUILD.md
    cmds:
      - '{{.FROST_BIN}} doctor'
