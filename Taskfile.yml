version: '3'

vars:
  FROST_BIN: '{{default "frost" .FROST_BIN}}'
  # The pinned toolchain. CI installs this exact checksummed release, and the
  # preconditions below refuse a different one: before 1.0 a Frost minor may
  # change manifest or CLI semantics, so "some frost is on PATH" is not enough
  # to make a local run mean the same thing as the CI run.
  FROST_VERSION: '0.8.0'

tasks:
  default:
    desc: Run all fast validation gates
    cmds:
      - task: check

  install:
    desc: Install the locked npm dependency graph
    cmds:
      - npm ci

  check:
    desc: Run every cached Frost test, typecheck, and release-validation gate
    preconditions:
      - sh: command -v "{{.FROST_BIN}}"
        msg: Install FrostBuild v{{.FROST_VERSION}}; see docs/BUILD.md
      - sh: test "$("{{.FROST_BIN}}" info version)" = "{{.FROST_VERSION}}"
        msg: This workspace is pinned to FrostBuild v{{.FROST_VERSION}}; see docs/BUILD.md
      - sh: test -d node_modules
        msg: Run `task install` first
    cmds:
      - '{{.FROST_BIN}} test --all --no-tui'

  test:
    desc: Run the cached unit-test gates
    preconditions:
      - sh: command -v "{{.FROST_BIN}}"
        msg: Install FrostBuild v{{.FROST_VERSION}}; see docs/BUILD.md
      - sh: test "$("{{.FROST_BIN}}" info version)" = "{{.FROST_VERSION}}"
        msg: This workspace is pinned to FrostBuild v{{.FROST_VERSION}}; see docs/BUILD.md
      - sh: test -d node_modules
        msg: Run `task install` first
    cmds:
      - >-
        {{.FROST_BIN}} test --no-tui
        iroha-pdf-core-test
        iroha-pdf-google-drive-test
        iroha-pdf-desktop-test
        iroha-pdf-mobile-test

  typecheck:
    desc: Run the cached TypeScript gates
    preconditions:
      - sh: command -v "{{.FROST_BIN}}"
        msg: Install FrostBuild v{{.FROST_VERSION}}; see docs/BUILD.md
      - sh: test "$("{{.FROST_BIN}}" info version)" = "{{.FROST_VERSION}}"
        msg: This workspace is pinned to FrostBuild v{{.FROST_VERSION}}; see docs/BUILD.md
      - sh: test -d node_modules
        msg: Run `task install` first
    cmds:
      - >-
        {{.FROST_BIN}} test --no-tui
        iroha-pdf-core-typecheck
        iroha-pdf-google-drive-typecheck
        iroha-pdf-desktop-typecheck
        iroha-pdf-mobile-typecheck

  build:desktop:
    desc: Build and cache the desktop web output tree with Frost
    preconditions:
      - sh: command -v "{{.FROST_BIN}}"
        msg: Install FrostBuild v{{.FROST_VERSION}}; see docs/BUILD.md
      - sh: test "$("{{.FROST_BIN}}" info version)" = "{{.FROST_VERSION}}"
        msg: This workspace is pinned to FrostBuild v{{.FROST_VERSION}}; see docs/BUILD.md
      - sh: test -d node_modules
        msg: Run `task install` first
    cmds:
      - '{{.FROST_BIN}} build desktop-web --no-tui'

  # Deliberately on the `release` profile rather than the default `debug` one.
  # Frost isolates outputs and caches per profile, and these are the packages a
  # release ships: they should not share a cache slot with, or overwrite, the
  # tree `task build:desktop` leaves behind for local work. It also means the
  # directory a release uploads from is called `release`.
  bundle:desktop:
    desc: Bundle the desktop app into installers for this host with Frost
    preconditions:
      - sh: command -v "{{.FROST_BIN}}"
        msg: Install FrostBuild v{{.FROST_VERSION}}; see docs/BUILD.md
      - sh: test "$("{{.FROST_BIN}}" info version)" = "{{.FROST_VERSION}}"
        msg: This workspace is pinned to FrostBuild v{{.FROST_VERSION}}; see docs/BUILD.md
      - sh: test -d node_modules
        msg: Run `task install` first
    vars:
      # One target per host: the bundlers `bundle.targets: "all"` selects, and
      # the arguments they need, are not the same on all three. See frost.toml.
      # `OS` is Task's own GOOS, so this resolves without shelling out to a
      # `uname` that a Windows runner may not have on PATH.
      TARGET: 'desktop-app-{{if eq OS "darwin"}}macos{{else if eq OS "windows"}}windows{{else}}linux{{end}}'
      # Only Windows needs a toolchain overlay, and asking for one changes
      # where Frost writes, so the other two hosts stay on the root
      # toolchain and keep the paths they already build into.
      PLATFORM: '{{if eq OS "windows"}} --platform windows{{end}}'
    cmds:
      - '{{.FROST_BIN}} build {{.TARGET}} --profile release{{.PLATFORM}} --no-tui'

  # The debug binary `npm run e2e:tauri` drives, which is not the one
  # `bundle:desktop` produces — see the target's comment in frost.toml. No
  # `--profile`: the target's output path is cargo's own `target/debug`, which
  # only lines up with Frost's default config.
  build:desktop:debug:
    desc: Build the debug desktop binary the real-runtime e2e drives with Frost
    preconditions:
      - sh: command -v "{{.FROST_BIN}}"
        msg: Install FrostBuild v{{.FROST_VERSION}}; see docs/BUILD.md
      - sh: test "$("{{.FROST_BIN}}" info version)" = "{{.FROST_VERSION}}"
        msg: This workspace is pinned to FrostBuild v{{.FROST_VERSION}}; see docs/BUILD.md
      - sh: test -d node_modules
        msg: Run `task install` first
    cmds:
      - '{{.FROST_BIN}} build desktop-app-linux-debug --no-tui'

  # Plain Node on purpose: the documentation site has no dependencies, so this
  # works in a fresh checkout with neither `task install` nor Frost. The cached
  # CI gate is the `iroha-pdf-site-build` Frost target, which `task check` runs.
  site:
    desc: Build the GitHub Pages documentation site into site/dist and check it
    cmds:
      - node site/build.mjs --out site/dist
      - node site/verify.mjs site/dist

  validate:
    desc: Validate release-facing EAS, brand, and dependency-patch policy
    preconditions:
      - sh: command -v "{{.FROST_BIN}}"
        msg: Install FrostBuild v{{.FROST_VERSION}}; see docs/BUILD.md
      - sh: test "$("{{.FROST_BIN}}" info version)" = "{{.FROST_VERSION}}"
        msg: This workspace is pinned to FrostBuild v{{.FROST_VERSION}}; see docs/BUILD.md
      - sh: test -d node_modules
        msg: Run `task install` first
    cmds:
      - >-
        {{.FROST_BIN}} test --no-tui
        iroha-pdf-eas-validate
        iroha-pdf-brand-validate
        iroha-pdf-store-validate
        iroha-pdf-dependency-patches

  ci:
    desc: Run the deterministic CI quality workflow
    cmds:
      - task: check
      - task: build:desktop
      - task: validate

  # Deliberately without the pinned-version precondition: this is the task you
  # run when a gate has just refused your binary, so it has to be able to run
  # against the wrong one. `info` comes last because a pre-0.8 Frost does not
  # have that subcommand, and its diagnostics are still worth printing first.
  frost:doctor:
    desc: Diagnose the local Frost toolchain and workspace
    preconditions:
      - sh: command -v "{{.FROST_BIN}}"
        msg: Install FrostBuild v{{.FROST_VERSION}}; see docs/BUILD.md
    cmds:
      - '{{.FROST_BIN}} --version'
      - '{{.FROST_BIN}} doctor'
      - '{{.FROST_BIN}} info'

  github:protect-main:
    desc: Preview or apply the required GitHub main-branch protection
    cmds:
      - APPLY="{{default "0" .APPLY}}" scripts/github/protect-main.sh
